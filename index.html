<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>برنامج البناء الميسر – المرحلة الثانية</title>
  <link rel="stylesheet" href="./style.css?v=6">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <div>
        <h1>برنامج البناء الميسر</h1>
        <p>المرحلة الثانية</p>
      </div>
      <div class="account" aria-label="الحساب والمزامنة">
        <span id="userName" class="user-name" hidden></span>
        <button id="authButton" type="button" disabled>تسجيل الدخول بحساب Google</button>
        <span id="syncStatus" class="sync-status" role="status">المزامنة السحابية غير مفعلة</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="overall card" aria-labelledby="progressTitle">
      <div class="overall-heading">
        <div>
          <p id="progressTitle" class="eyebrow">التقدم الكلي</p>
          <strong id="overallPercent" class="overall-percent">0%</strong>
        </div>
        <p class="count"><span id="completedCount">0</span> من <span id="totalCount">0</span> درساً</p>
      </div>
      <div class="progress" role="progressbar" aria-label="التقدم الكلي" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="overallBar"></span>
      </div>
    </section>

    <section class="toolbar" aria-label="البحث وإدارة المقررات">
      <div class="search-section">
        <label class="sr-only" for="searchInput">ابحث في المقررات</label>
        <input id="searchInput" type="search" placeholder="ابحث في المقررات..." autocomplete="off">
      </div>
      <button id="manageCoursesButton" class="manage-button" type="button">إدارة المقررات</button>
    </section>

    <section id="courses" class="courses" aria-label="المقررات"></section>
    <p id="emptyState" class="empty card" hidden>لا توجد نتائج مطابقة.</p>
  </main>

  <footer>يتم حفظ تقدمك تلقائياً</footer>

  <dialog id="courseDialog" class="course-dialog">
    <form id="courseForm" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">تخصيص المحتوى</p>
          <h2>إدارة المقررات</h2>
        </div>
        <button id="closeCourseDialog" class="icon-button" type="button" aria-label="إغلاق">×</button>
      </div>

      <label for="courseSelect">المقرر</label>
      <select id="courseSelect"></select>

      <label for="courseTitle">عنوان المقرر</label>
      <input id="courseTitle" required>

      <label for="courseUrl">رابط المادة</label>
      <input id="courseUrl" type="url" dir="ltr" placeholder="https://...">

      <label for="newLessons">دروس جديدة <small>اكتب كل درس في سطر</small></label>
      <textarea id="newLessons" rows="5" placeholder="الدرس الأول&#10;الدرس الثاني"></textarea>

      <div class="dialog-actions">
        <button id="newCourseButton" type="button">إضافة مقرر جديد</button>
        <button class="save-course" type="submit">حفظ</button>
      </div>
    </form>
  </dialog>

  <dialog id="notePageDialog" class="note-page-dialog">
    <div class="note-page-shell">
      <header class="note-page-header">
        <div>
          <p class="eyebrow">ملخص الدرس</p>
          <h2 id="notePageTitle"></h2>
        </div>
        <button id="closeNotePage" class="icon-button" type="button" aria-label="إغلاق صفحة الملاحظات">×</button>
      </header>
      <label class="sr-only" for="notePageTextarea">ملخص الدرس</label>
      <textarea id="notePageTextarea" placeholder="اكتب ملخص الدرس وملاحظاتك هنا..."></textarea>
      <p class="note-page-hint">يتم حفظ الملخص تلقائياً</p>
    </div>
  </dialog>
  <script type="module" src="./app.js?v=6"></script>
</body>
</html>
